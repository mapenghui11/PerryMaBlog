{{- with site.Params.homeInfoParams }}
<article class="first-entry home-info journal-masthead">
    <div class="journal-masthead-line"></div>
    <div class="journal-mark">◈</div>
    <header class="entry-header">
        <h1>{{ .Title | markdownify }}</h1>
    </header>
    <div class="entry-content journal-subtitle">
        {{ .Content | markdownify }}
    </div>
    <div class="journal-masthead-line"></div>
</article>
{{- end -}}
